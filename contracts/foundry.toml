[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# test/IndexerAbi.t.sol compares the curated indexer ABIs against the compiled artifacts.
fs_permissions = [{ access = "read", path = "./abi" }, { access = "read", path = "./out" }]
