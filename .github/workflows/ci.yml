name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-audit:
    name: A14 secret and recording-integrity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run audit regression suite
        run: ./scripts/a14-audit-test
      - name: Scan tracked tree and complete reachable history
        run: ./scripts/a14-audit

  contracts:
    name: Contracts and duplicate-advance protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run complete contract suite
        run: forge test --root contracts -vvv
      # Work-split acceptance criterion AT-17.
      - name: Second advance on the same job reverts
        run: forge test --root contracts --match-test secondAdvanceOnPriorJobReverts -vvv
      # Named contract-side acceptance gates. These already run inside the full suite above;
      # this step names them so a green check reports each AT by ID, matching AT-16/17/18.
      #   AT-01 create/fund escrows full payment  -> test_fund_escrowsFullPaymentAndEmits
      #   AT-07 delivery + settlement             -> test_acceptDelivery_poolIsPaidBeforeOperator
      #   AT-08 audit anchor (root matches)       -> test_anchorJob_* (round trip, tamper, access, immutability)
      #   AT-11 advance issuance 12.50            -> test_requestAdvance_demoNumbers
      #   AT-12 settlement waterfall / escrow     -> test_acceptDelivery_poolIsPaidBeforeOperator, testFuzz_settlement_escrowAlwaysCoversPool
      #   AT-13 rate flywheel up + down           -> test_demoSpine_rateRisesAfterAcceptance, test_advanceRate_risesFivePointsPerAcceptedJob, test_advanceRate_fallsFifteenPointsPerWriteOff
      #   AT-14 write-off loss waterfall order    -> test_writeOff_lossWaterfallStageOrder
      #   AT-15 unauthorized advance (contract)   -> test_requestAdvance_revertsForAnyNonTreasury, test_requestAdvance_paysOnlyTheRegisteredTreasury
      - name: Contract acceptance gates (AT-01/07/08/11/12/13/14/15)
        run: |
          forge test --root contracts --match-test 'test_fund_escrowsFullPaymentAndEmits|test_acceptDelivery_poolIsPaidBeforeOperator|testFuzz_settlement_escrowAlwaysCoversPool|test_requestAdvance_demoNumbers|test_requestAdvance_revertsForAnyNonTreasury|test_requestAdvance_paysOnlyTheRegisteredTreasury|test_demoSpine_rateRisesAfterAcceptance|test_advanceRate_risesFivePointsPerAcceptedJob|test_advanceRate_fallsFifteenPointsPerWriteOff|test_writeOff_lossWaterfallStageOrder|test_anchorJob_' -vvv

  daemon:
    name: Daemon integration and worker isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: daemon/go.sum
      - name: Run daemon integration suite
        run: go test -race ./...
      # Work-split acceptance criterion AT-16.
      - name: Worker has no path to funding
        run: go test ./internal/brain -run '^TestAT16_' -count=1
      # Named daemon-side acceptance gates. These already run inside the full suite above;
      # this step names them so a green check reports each AT by ID, matching AT-16/17/18.
      #   AT-02 auto-approve $0.04, no human      -> TestDemoPolicy_ProducesTheScriptedBeats (beat 1)
      #   AT-03 escalate $4.00, no pre-sig        -> TestDemoPolicy_ProducesTheScriptedBeats (beat 2), TestAT03_*
      #   AT-04 rejected alt / adapt cheaper      -> TestAT04_*, TestG8_RejectWithCostReasonAdaptsAndLinks
      #   AT-05 post-approval substitution denied -> TestAT05_*
      #   AT-09 kill switch halts claims/pays     -> TestAT09_*
      #     NOTE: these assert the freeze HALTS payments, advances and settlement. They do NOT
      #     assert the SEC-009 "<=1 s" bound. That bound holds by construction — freeze is a
      #     synchronous in-memory flag check — but it is not measured here. A green AT-09 gate
      #     means "stops", not "stops within a timed budget".
      #   AT-10 restart recovery + Brain rebuild  -> TestRecover_BrainRehydratesJobStages, TestRecover_LifecycleReplaysFromEvents, TestG4_MemoryFilesSurviveRestart, TestAT10Extended_* (executed payment never repeats)
      #   AT-15 unauthorized advance (API/intake) -> TestAT15_*
      #   AT-19 QA rejection blocks DeliveryReady -> TestAT19_PlantedClaimBlocksDeliveryReadyUntilRevised
      # (AT-06 egress protection is intentionally absent: no runtime enforcement exists in v1 — see PRD §11.2.)
      - name: Daemon acceptance gates (AT-02/03/04/05/09/10/15/19)
        run: |
          go test ./... -count=1 -run 'TestAT0[3459]_|TestAT15_|TestAT19_|TestAT10Extended_|TestDemoPolicy_ProducesTheScriptedBeats|TestG8_RejectWithCostReasonAdaptsAndLinks|TestG4_MemoryFilesSurviveRestart|TestRecover_BrainRehydratesJobStages|TestRecover_LifecycleReplaysFromEvents'

  sidecar:
    name: Sidecar integration and Circle facilitator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run service:test
      - run: npm run store:test
      - name: Post-sign taxonomy (a released reservation behind a signed authorization)
        # buyer.ts documents which failures leave a signed bearer authorization in the seller's
        # hands. service.ts implemented half of it, so PAYMENT_REJECTED became FAILED and the
        # daemon read that as "nothing settled, release". Inert only while nothing broadcasts.
        run: npm run test:post-sign
      - name: Seller survives malformed payments
        # Twelve bodies that each used to exit the process, including a well-formed payment whose
        # signature does not recover. A dead seller mid-demo is unrecoverable on stage.
        run: npm run test:seller-hostile
      # Work-split acceptance criterion AT-18.
      - name: H3 cross-language golden vectors
        # Pins intentHash/paymentId/authNonce against the identical constants asserted in
        # daemon/internal/approval/hash_test.go. A canonicalization divergence between the two
        # languages makes every payment fail INTENT_HASH_MISMATCH, and this is the only thing
        # that catches it before the daemon is wired to the sidecar.
        run: npm run test:h3-vectors
      - name: Validate the Circle facilitator fixture contract
        run: npm run test:circle-facilitator-fixture
      - name: Verify the real Circle V1 fixture when supplied
        if: ${{ hashFiles('sidecar/fixtures/v1-circle-payment.json') != '' }}
        run: npm run verify:circle-facilitator-fixture -- fixtures/v1-circle-payment.json

  # dashboard/ had no CI job at all, so its ~45 TS/TSX/CSS files were never typechecked,
  # tested or built by anything but the author's machine: PRs #40, #42, #43 and #44 all
  # landed on local verification alone. This job closes that gap and makes the owner-facing
  # surface fail the same way the sidecar does. Note the build step is the first place the
  # native SWC path runs at all, since Windows Application Control blocks that binary on the
  # author's machine, so a break here is expected to surface in CI before anywhere else.
  dashboard:
    name: Dashboard typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
